<!DOCTYPE html>
<html lang="en">
<head><!-- paras-command-centre-idle-timeout -->
<script>
/* Idle timeout -- "Are you there?"
 *
 * After 10 minutes with no activity anywhere in the app -- the hub itself,
 * or inside any open dashboard -- a prompt appears. "Yes" dismisses it and
 * the clock starts over; "No", or 30 seconds of silence after the prompt
 * appears, signs out.
 *
 * Dashboards load inside iframes on the hub page (see app.js's
 * openDashboard), which are separate browsing contexts: mouse/keyboard
 * activity inside one does not reach the parent page's own listeners. This
 * one script plays two different roles depending on where it ends up
 * running, so the same file can be included everywhere (the hub directly,
 * every dashboard via sync.py's ensure_idle_timeout) without needing two
 * versions kept in sync:
 *
 *   - Inside a dashboard iframe: just relays "something happened" up to
 *     the parent page, throttled -- it does not own a clock or a prompt of
 *     its own, since a dashboard should not show its own competing dialog.
 *   - On the hub page (the top frame): owns the actual 10-minute clock,
 *     listens for its own activity plus relayed messages from every open
 *     dashboard, and is the one place that shows the prompt and signs out.
 */
(function (w, d) {
  // Overridable only for testing (set before this script runs) -- real
  // usage always gets the 10-minute/30-second defaults.
  var IDLE_MS = w.__PARAS_IDLE_MS_OVERRIDE__ || 10 * 60 * 1000;
  var PROMPT_SECONDS = w.__PARAS_IDLE_PROMPT_SECONDS_OVERRIDE__ || 30;
  var ACTIVITY_EVENTS = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'wheel'];

  if (w !== w.top) {
    var lastSent = 0;
    function relay() {
      var now = Date.now();
      if (now - lastSent < 2000) return;   // no need to message the parent on every pixel of mouse movement
      lastSent = now;
      try { w.parent.postMessage({ parasIdle: 'activity' }, '*'); } catch (e) {}
    }
    ACTIVITY_EVENTS.forEach(function (ev) { d.addEventListener(ev, relay, { passive: true, capture: true }); });
    return;
  }

  var idleTimer = null, promptTimer = null, modal = null;

  function resetIdle() {
    if (modal) return;   // only an explicit Yes/No or the timeout resolves an open prompt -- background activity elsewhere should not silently dismiss it
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showPrompt, IDLE_MS);
  }

  ACTIVITY_EVENTS.forEach(function (ev) { d.addEventListener(ev, resetIdle, { passive: true, capture: true }); });
  w.addEventListener('message', function (e) {
    if (e.data && e.data.parasIdle === 'activity') resetIdle();
  });

  function buildModal() {
    var wrap = d.createElement('div');
    wrap.id = 'idleCheck';
    wrap.setAttribute('style',
      'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;' +
      'background:rgba(8,12,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);');
    wrap.innerHTML =
      '<div style="background:#141b2b;color:#eef2f8;' +
      'border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:26px 28px;max-width:340px;' +
      'text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);' +
      'font:14px/1.5 -apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;">' +
      '<div style="font-size:17px;font-weight:700;margin-bottom:8px;">Are you there?</div>' +
      '<div style="opacity:.75;margin-bottom:18px;">Signing out in <span id="idleCheckSecs">' + PROMPT_SECONDS +
      '</span>s if there is no answer.</div>' +
      '<div style="display:flex;gap:10px;justify-content:center;">' +
      '<button id="idleCheckNo" type="button" style="padding:9px 18px;border-radius:10px;' +
      'border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:inherit;cursor:pointer;">No</button>' +
      '<button id="idleCheckYes" type="button" style="padding:9px 18px;border-radius:10px;border:none;' +
      'background:#2f6fed;color:#fff;font:inherit;font-weight:600;cursor:pointer;">Yes, I\'m here</button>' +
      '</div></div>';
    return wrap;
  }

  function showPrompt() {
    if (modal) return;
    modal = buildModal();
    d.body.appendChild(modal);
    var secs = PROMPT_SECONDS;
    var secsEl = modal.querySelector('#idleCheckSecs');
    modal.querySelector('#idleCheckYes').addEventListener('click', dismissPrompt);
    modal.querySelector('#idleCheckNo').addEventListener('click', signOut);
    promptTimer = setInterval(function () {
      secs -= 1;
      if (secsEl) secsEl.textContent = String(Math.max(secs, 0));
      if (secs <= 0) signOut();
    }, 1000);
  }

  function teardownModal() {
    clearInterval(promptTimer);
    promptTimer = null;
    if (modal && modal.parentNode) modal.parentNode.removeChild(modal);
    modal = null;
  }

  function dismissPrompt() {
    teardownModal();
    resetIdle();
  }

  function signOut() {
    teardownModal();
    if (w.ParasGate && typeof w.ParasGate.lock === 'function') {
      w.ParasGate.lock();
    } else {
      if (location.protocol !== 'file:') { try { fetch('__logout', { method: 'POST' }); } catch (e) {} }
      w.location.reload();
    }
  }

  resetIdle();
})(window, document);
</script>
<!-- /paras-command-centre-idle-timeout -->
<!-- paras-command-centre-session-guard -->
<script>
/* Makes a dashboard's own localStorage-based "remember my data" behave the
 * same way the Command Centre's SESSION / LOCAL switch already behaves for
 * the shell itself: SESSION starts every dashboard fresh, like a private
 * window, and keeps whatever it saves only until this tab closes; LOCAL
 * keeps what the dashboard saved, same as today.
 *
 * Must run before anything else on the page, because some dashboards read
 * localStorage synchronously while parsing the body (auto-restoring a
 * previous upload) -- by the time a script at the bottom of the page ran,
 * that read would already have happened. Runs before the dashboard's own
 * markup or scripts, and never touches how the dashboard's code is written.
 *
 * Dashboards share the same browser origin as the Command Centre shell, so
 * this read of 'paras.cc.mode' sees the shell's real, current mode with no
 * cross-window messaging needed. Session mode is backed by sessionStorage --
 * the same "gone when this tab closes" store the shell itself already uses
 * for its own Session-mode data -- so a reload mid-session still sees what
 * was just saved, only a fresh tab starts clean.
 *
 * window.__parasSessionMode is set below BEFORE the localStorage swap, and
 * left alone afterwards -- it is the one place any script loaded later on
 * this page can ask "is this tab actually in Session mode?" and get the real
 * answer. Reading w.localStorage.getItem('paras.cc.mode') again after this
 * script has run does NOT work for that: once swapped, w.localStorage IS
 * sessionStorage, which was never where the shell wrote that flag, so it
 * reads back empty and looks like Local mode even while this really is
 * Session mode. Getting that wrong would leak server-backed data (an
 * auto-loaded database, say) into what is supposed to be a private,
 * nothing-persisted session -- worth one extra global rather than trusting
 * a read that only happens to work before this script runs.
 */
(function (w) {
  'use strict';
  var isSession = false;
  try {
    isSession = w.localStorage.getItem('paras.cc.mode') === 'session';
  } catch (e) { /* storage unavailable -- treat as not-session, same as before */ }
  w.__parasSessionMode = isSession;
  if (!isSession) return;
  try {
    Object.defineProperty(w, 'localStorage', {
      value: w.sessionStorage, configurable: true, enumerable: true,
    });
  } catch (e) { /* non-configurable -- leave real localStorage alone */ }
})(window);
</script>
<!-- /paras-command-centre-session-guard -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Employee Permission Dashboard</title>
<style>
  :root{
    --bg:#0e1420; --surface:#161d2d; --glass:rgba(26,34,52,0.68);
    --text-primary:#eef1f7; --text-secondary:#a7afc4; --text-muted:#6d7690;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.18);
    --accent:#4f7cc4; --accent-2:#78a2e6; --accent-bg:rgba(79,124,196,0.18); --accent-text:#9dc2f4;
    --report:#a883d9; --report-bg:rgba(138,92,201,0.2); --report-text:#cdb3ee;
    --warn-bg:rgba(230,170,40,0.16); --warn-text:#f0c56b;
    --danger-bg:rgba(226,75,75,0.16); --danger-text:#f2a3a3;
    --ok-bg:rgba(40,180,110,0.16); --ok-text:#7fdcac;
    --radius:14px;
  }
  /* ---------- Light theme ----------
     Follows the Command Centre shell's own dark/light toggle -- see the
     "parasthemechange" bridge relay near the bottom of this file's script.
     Accent hues (accent/accent-2/report) are unchanged: saturated enough to
     read on both a near-black and a near-white surface, so only the neutral
     surface/text/tint tokens need a light variant, plus a few corrective
     rules below for literal colors that don't route through a var. */
  :root[data-theme="light"]{
    --bg:#F4F5F7; --surface:#EBECEF; --glass:rgba(255,255,255,0.55);
    --text-primary:#101826; --text-secondary:#4A5768; --text-muted:#7B8792;
    --border:rgba(16,24,38,0.08); --border-strong:rgba(16,24,38,0.16);
    --accent:#4f7cc4; --accent-2:#78a2e6; --accent-bg:rgba(79,124,196,0.14); --accent-text:#2f5ca2;
    --report:#a883d9; --report-bg:rgba(138,92,201,0.14); --report-text:#6b3fa0;
    --warn-bg:rgba(230,170,40,0.16); --warn-text:#8a5a00;
    --danger-bg:rgba(226,75,75,0.12); --danger-text:#c0392b;
    --ok-bg:rgba(40,180,110,0.12); --ok-text:#12805a;
    color-scheme: light;
  }
  /* Flat and neutral on purpose -- see the matching note on the same
     pattern in Local_Purchase_Dashboard.html. */
  :root[data-theme="light"] body{
    background:#F4F5F7;
  }
  :root[data-theme="light"] body::before{
    background:none;
  }
  :root[data-theme="light"] body::after{
    background-image:radial-gradient(rgba(16,24,38,.05) 1px, transparent 1px);
  }
  :root[data-theme="light"] .topbar{ background:rgba(255,255,255,.72); border-bottom-color:rgba(16,24,38,.08); }
  :root[data-theme="light"] .card{
    background:linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,255,255,.62));
    border-color:rgba(16,24,38,.08); border-top-color:rgba(255,255,255,.9);
    box-shadow:0 8px 26px rgba(16,24,38,.10), inset 0 1px 0 rgba(255,255,255,.6);
  }
  :root[data-theme="light"] .card:hover{
    box-shadow:0 16px 36px rgba(16,24,38,.14), 0 0 0 1px rgba(79,124,196,.18), inset 0 1px 0 rgba(255,255,255,.7);
  }
  :root[data-theme="light"] .metric-value{ color:var(--text-primary) !important; text-shadow:none !important; }
  :root[data-theme="light"] .orgtable .colhead{ background:rgba(16,24,38,.04); }
  :root[data-theme="light"] .rutable thead th,
  :root[data-theme="light"] .rutable tr:first-child th{ background:rgba(16,24,38,.04); }
  :root[data-theme="light"] .rutable th.rutable-group-clinic{ background:rgba(230,170,40,.14)!important; }
  :root[data-theme="light"] .rutooltip{ color:#eef1f7; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 15% 0%, #1b2740 0%, #0e1420 45%, #0e1420 100%);color:var(--text-primary);
    position:relative;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:-10%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(circle at 18% 22%, rgba(79,124,196,.22), transparent 42%),
      radial-gradient(circle at 82% 28%, rgba(168,131,217,.16), transparent 44%),
      radial-gradient(circle at 55% 92%, rgba(120,162,230,.14), transparent 48%);
    filter:blur(50px);animation:liquidDrift 16s ease-in-out infinite alternate;will-change:transform;}
  body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:34px 34px;opacity:.5;}
  @keyframes liquidDrift{
    0%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(3%,-2.5%,0) scale(1.09);}
    100%{transform:translate3d(-2.5%,2%,0) scale(1.04);}
  }
  @keyframes redBlink{0%,100%{opacity:1;}50%{opacity:.38;}}
  @keyframes badgeBlink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(226,75,75,.55);}
    50%{opacity:.55;box-shadow:0 0 10px 3px rgba(226,75,75,.35);}}
  .blink-red{animation:redBlink 1.3s ease-in-out infinite;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 1.5rem 4rem;}
  .topbar{background:rgba(14,20,32,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.08);padding:1.1rem 1.5rem;margin-bottom:1.5rem;
    position:sticky;top:0;z-index:50;}
  .topbar-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{height:36px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 10px;}
  .brand-divider{width:1px;height:32px;background:var(--border-strong);}
  .brand-text h1{font-size:18px;font-weight:600;margin:0;color:var(--text-primary);}
  .brand-text p{font-size:12px;color:var(--accent);margin:2px 0 0;font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
  .prepared-by{font-size:13px;color:var(--text-secondary);text-align:right;}
  .prepared-by strong{color:var(--text-primary);}

  .uploadzone{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.5rem;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;transition:all .35s cubic-bezier(.22,1,.36,1);}
  .uploadzone.drag{border-color:var(--accent);background:var(--accent-bg);transform:scale(1.01);}
  .uploadzone .icon{font-size:22px;}
  .uploadzone .txt{flex:1;min-width:200px;}
  .uploadzone .txt strong{display:block;font-size:14px;}
  .uploadzone .txt span{font-size:12.5px;color:var(--text-secondary);}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;box-shadow:0 4px 14px rgba(47,94,163,.25);}
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 20px rgba(47,94,163,.32);}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none;}
  #fileStatus{font-size:12.5px;margin-top:2px;}
  #fileStatus.ok{color:var(--ok-text);}
  #fileStatus.err{color:var(--danger-text);}

  #tabs{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;
    position:sticky;z-index:40;padding:12px 0;}
  .tabbtn{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border-strong);border-radius:999px;
    padding:9px 18px;font-size:13.5px;cursor:pointer;color:var(--text-secondary);font-weight:600;
    transition:all .35s cubic-bezier(.22,1,.36,1);}
  .tabbtn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent);}
  .tabbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(47,94,163,.3);}
  .panel{display:none;animation:fadeUp .45s cubic-bezier(.34,1.56,.64,1);}
  .panel.show{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes popIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  .btn:active, .chip:active, .tabbtn:active, .unitchip:active, .grpbtn:active, .orgtable:active{
    transform:scale(.95) !important; transition:transform .12s cubic-bezier(.34,1.56,.64,1) !important;}
  .fx-in{opacity:0;animation:fadeSlideUp .55s cubic-bezier(.22,1.1,.36,1) forwards;}

  .card{background:linear-gradient(160deg, rgba(40,50,74,.62), rgba(20,27,42,.5));
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.28);
    border-radius:var(--radius);padding:1.1rem;position:relative;overflow:hidden;
    box-shadow:0 8px 26px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .32s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;will-change:transform;}
  .card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 16px 36px rgba(0,0,0,.4), 0 0 0 1px rgba(120,162,230,.18), inset 0 1px 0 rgba(255,255,255,.1);}
  .metric-label{font-size:12.5px;color:var(--text-secondary);margin:0 0 4px;display:flex;align-items:center;gap:6px;}
  .metric-value{font-size:28px;font-weight:700;margin:0;color:var(--text-primary);}
  .metric-sub{font-size:11.5px;color:var(--text-muted);margin:4px 0 0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:1.5rem;}

  table.dt{width:100%;border-collapse:collapse;font-size:13.5px;background:transparent;}
  table.dt th{text-align:left;color:var(--text-secondary);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--border-strong);
    position:sticky;top:0;background:var(--surface);}
  table.dt td{padding:8px 10px;border-bottom:1px solid var(--border);}
  .table-wrap{max-height:480px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
  .badge{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:999px;margin:3px 5px 3px 0;font-weight:600;}
  .hscroll{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .hscroll .badge{flex-shrink:0;margin:0;white-space:nowrap;}
  .hscroll::-webkit-scrollbar{height:6px;}
  .hscroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;}
  select,input{font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-primary);}
  .controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .controls input{flex:1;min-width:180px;}
  .note{font-size:13.5px;color:var(--text-secondary);margin:0 0 12px;}
  canvas{max-width:100%;}

  .chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chipgroups{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:16px;}
  @media(max-width:700px){.chipgroups{grid-template-columns:1fr;}}
  .chipgroup{display:flex;flex-direction:column;gap:8px;}
  .chipgroup-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:2px;}
  .chipgroup-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chipdivider{width:1px;background:var(--border-strong);}
  .grpbtn{background:var(--glass);backdrop-filter:blur(10px);border:1.5px solid var(--border-strong);border-radius:999px;
    padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-secondary);
    transition:all .35s cubic-bezier(.22,1,.36,1);}
  .grpbtn:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent);}
  .grpbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(47,94,163,.3);}
  .grpbar{display:flex;gap:10px;margin:4px 0 22px;}
  .multigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .vacantunits{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .chip{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border-strong);border-radius:999px;
    padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-secondary);
    transition:all .35s cubic-bezier(.22,1,.36,1);}
  .chip:hover{transform:translateY(-2px) scale(1.04);border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(47,94,163,.3);transform:scale(1.05);}

  .rightscols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:700px){.rightscols{grid-template-columns:1fr;}}
  .rightbox h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .rightbox .count{font-size:11.5px;background:var(--surface-1);padding:2px 8px;border-radius:999px;color:var(--text-secondary);}

  .unitbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .unitgrouplabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:0 0 8px;}
  .unitchip{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border-strong);border-radius:12px;
    padding:10px 16px;cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1);min-width:110px;text-align:center;}
  .unitchip:hover{transform:translateY(-3px);}
  .unitchip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 8px 20px rgba(47,94,163,.32);}
  .unitchip .uname{font-weight:700;font-size:13.5px;}
  .unitchip .ucount{font-size:11px;opacity:.8;}

  .orgwrap{padding:1rem 0 2rem;display:flex;justify-content:center;width:100%;}
  .orgchain{display:flex;flex-direction:column;align-items:center;width:100%;max-width:1040px;}
  .orgscroll{width:100%;overflow-x:auto;padding:0 4px 8px;}
  .orgbranchrow{display:flex;gap:14px;padding-top:22px;
    width:fit-content;max-width:100%;margin:0 auto;position:relative;justify-content:center;}
  .orgbranchrow::before{content:'';position:absolute;top:0;left:var(--line-left,0);right:var(--line-right,0);height:2px;
    background:linear-gradient(90deg, var(--accent-2) 0%, #dce8fb 20%, var(--accent-2) 45%, var(--accent) 70%, var(--accent-2) 100%);

  @keyframes lineFlowH{0%{background-position:0% 0;}100%{background-position:100% 0;}}
  .orgbranchitem{position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
  .orgbranchitem::before{content:'';position:absolute;top:-22px;left:50%;width:2px;height:22px;
    background:var(--border-strong);transform:translateX(-1px);}

  .orgbranchitem .orgtable .rolehead{font-size:11px;padding:8px 7px;}

    background-size:100% 300%;animation:lineFlow 1.3s linear infinite;}
  .orgconn::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:9px;height:9px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px rgba(120,162,230,.7);

  @keyframes dotTravel{0%{top:0%;opacity:0;}12%{opacity:1;}88%{opacity:1;}100%{top:100%;opacity:0;}}

<script>

var REPORT_RIGHTS = new Set(["ADT Reports","Stock Report","qoh all","stock ledger","item utility","item utility report","inventory register",
  "Department Consumption Register","Department Indent Register","Department Issue Register","GRN Register",
  "Opening Stock Register","Pending Purchase Register","PO Closure Register","Purchase Amendment Register",
  "Purchase Indent Register","Purchase Register","RTV Register","Stock Adjustment Register","Stock Transfer Register",
  "WorkOrder Register","ABC Analysis","MIS Reports","Batch Audit Report","Cost of Goods Report","Expiry Item Report",
  "FSN Report","GP Report","Inventory Days Report","IP Issue TAT Report","Item Drug Schedule Sale Register",
  "Items Movement Summary Report","Non Moving Item Report","OP Prescription Report","Stock Bounce Register",
  "Stock In-Transit Report","Zero Stock Items"]);
function isReportRight(name){
  if(REPORT_RIGHTS.has(name)) return true;
  var n = String(name).toLowerCase();
  return n.indexOf('report')>-1 || n.indexOf('register')>-1;
}

var ORG_TREE = [
  { head:"Pharmacy Head", children:[
      {role:"OP Pharmacy In Charge", pharm:"OP Pharmacy pharmacist"},
      {role:"IP Pharmacy In Charge", pharm:"IP Pharmacy Pharmacist"},
      {role:"OT/Cath Pharmacy In Charge", pharm:"OT/Cath Pharmacy Pharmacist"},
      {role:"Material Store Incharge", pharm:"GRN Executive"},

    ]},
  { head:"Purchase Head", children:[
      {role:"Purchase (Drugs)", pharm:null},
      {role:"Purchase (Medical Consumables)", pharm:null},
      {role:"Purchase (Non-Medical)", pharm:null}
    ]}
];

function esc(s){return String(s==null?'':s).replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function staggerIn(container, selector, baseDelay){
  if(!container) return;
  var items = container.querySelectorAll(selector);
  Array.prototype.forEach.call(items, function(el, i){
    el.classList.remove('fx-in');
    void el.offsetWidth;
    el.style.animationDelay = (Math.min(i,16)*(baseDelay||28)) + 'ms';
    el.classList.add('fx-in');
  });
}
function wireTilt(){ /* 3D tilt removed; hover bounce is handled by CSS :hover */ }
function animateCounters(container){
  if(!container) return;
  var els = container.querySelectorAll('.metric-value');
  Array.prototype.forEach.call(els, function(el){
    var target = parseInt(String(el.textContent).replace(/[^0-9\-]/g,''), 10);
    if(isNaN(target)) return;
    var start = 0, duration = 650, startTime = null;
    function tick(ts){
      if(!startTime) startTime = ts;
      var progress = Math.min((ts-startTime)/duration, 1);
      var eased = 1 - Math.pow(1-progress, 3);
      el.textContent = Math.round(start + (target-start)*eased);
      if(progress < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  });
}


var ruTooltipEl = null;
function ensureRuTooltip(){
  if(!ruTooltipEl){
    ruTooltipEl = document.createElement('div');
    ruTooltipEl.className = 'rutooltip';
    document.body.appendChild(ruTooltipEl);
  }
  return ruTooltipEl;
}
function wireRuTooltips(selector){
  var tip = ensureRuTooltip();
  var cells = document.querySelectorAll(selector || '.rutable td[data-tip]');
  Array.prototype.forEach.call(cells, function(cell){
    cell.addEventListener('mouseenter', function(e){
      tip.textContent = cell.getAttribute('data-tip');
      tip.style.display = 'block';
      positionRuTooltip(e);
    });
    cell.addEventListener('mousemove', function(e){ positionRuTooltip(e); });
    cell.addEventListener('mouseleave', function(){ tip.style.display = 'none'; });
  });
}
function positionRuTooltip(e){
  var tip = ensureRuTooltip();
  var pad = 14;
  var x = e.clientX + pad, y = e.clientY + pad;
  var maxX = window.innerWidth - tip.offsetWidth - 8;
  var maxY = window.innerHeight - tip.offsetHeight - 8;
  if(x > maxX) x = e.clientX - tip.offsetWidth - pad;
  if(y > maxY) y = e.clientY - tip.offsetHeight - pad;
  tip.style.left = Math.max(4,x) + 'px';
  tip.style.top = Math.max(4,y) + 'px';
}
function norm(s){return String(s==null?'':s).replace(/\s+/g,' ').trim();}
function initials(name){
  var parts = norm(name).split(' ').filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}

// ---------- PARSING (mirrors the python extraction logic) ----------
function parseWorkbook(wb){
  var sheetNames = wb.SheetNames;
  if(sheetNames.indexOf('new') === -1){
    throw new Error("No sheet named 'new' found (rights matrix). Sheet names: " + sheetNames.join(', '));
  }
  var rolesResult = extractRights(wb.Sheets['new']);
  var roles = rolesResult.roles;
  var rightsPerRole = rolesResult.rightsPerRole;

  var units = {}, unitNames = {};
  sheetNames.forEach(function(name){
    if(name === 'new') return;
    unitNames[name] = name.charAt(0).toUpperCase() + name.slice(1);
    units[name] = extractUnit(wb.Sheets[name], roles);
  });

  var multiRole = computeMultiRole(units, roles);
  return {roles:roles, rightsPerRole:rightsPerRole, unitNames:unitNames, units:units, multiRole:multiRole};
}

function extractRights(sheet){
  var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
  if(!rows.length) return {roles:[], rightsPerRole:{}};
  var header = rows[0];
  var roleCols = [];
  header.forEach(function(h,i){
    if(i<2 || h==null) return;
    if(norm(h).toLowerCase()==='to be') return;
    roleCols.push([i, norm(h)]);
  });
  var rightsPerRole = {};
  roleCols.forEach(function(rc){ rightsPerRole[rc[1]] = []; });
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    var rightName = row[0]!=null && row[0]!=='' ? row[0] : row[1];
    if(rightName==null) continue;
    rightName = norm(rightName);
    if(!rightName) continue;
    roleCols.forEach(function(rc){
      var val = row[rc[0]];
      var truthy = (val===true) || (val===1) || (val==='1') || (val===1.0);
      if(truthy) rightsPerRole[rc[1]].push(rightName);
    });
  }
  return {roles: roleCols.map(function(rc){return rc[1];}), rightsPerRole:rightsPerRole};
}

function extractUnit(sheet, roles){
  var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
  var employees = {};
  roles.forEach(function(r){ employees[r] = []; });
  if(!rows.length) return employees;
  var header = rows[0];
  var rolePairs = [];
  header.forEach(function(h,i){
    if(h!=null && norm(h)!=='') rolePairs.push([i, norm(h)]);
  });
  var start = 1;
  if(rows.length>1 && rows[1] && String(rows[1][0]||'').trim().toUpperCase()==='ID') start = 2;
  for(var r=start;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    rolePairs.forEach(function(rp){
      var id = row[rp[0]], name = row[rp[0]+1];
      var idS = id!=null?String(id).trim():'';
      var nameS = name!=null?String(name).trim():'';
      if(idS.toUpperCase()==='STAFF NOT AVAILABLE') return;
      if(!idS && !nameS) return;
      if(!employees[rp[1]]) employees[rp[1]] = [];
      employees[rp[1]].push({id:idS, name:nameS});
    });
  }
  return employees;
}

function computeMultiRole(units, roles){
  var multiRole = {};
  Object.keys(units).forEach(function(u){
    var empRoles = {};
    roles.forEach(function(r){
      (units[u][r]||[]).forEach(function(e){
        var key = e.id || e.name;
        if(!empRoles[key]) empRoles[key] = {name:e.name, id:e.id, roles:[]};
        if(empRoles[key].roles.indexOf(r)===-1) empRoles[key].roles.push(r);
      });
    });
    multiRole[u] = Object.keys(empRoles).map(function(k){return empRoles[k];}).filter(function(v){return v.roles.length>1;});
  });
  return multiRole;
}

function isClinicUnit(u){
  var nm = String(D.unitNames[u]||u).toLowerCase();
  return nm.indexOf('clinic')>-1;
}
function segregatedUnits(keys, sortFn){
  var hospitals = keys.filter(function(u){return !isClinicUnit(u);});
  var clinics = keys.filter(function(u){return isClinicUnit(u);});
  if(sortFn){ hospitals.sort(sortFn); clinics.sort(sortFn); }
  return {hospitals:hospitals, clinics:clinics, all:hospitals.concat(clinics)};
}
function unitStaffCount(u){
  var c = 0;
  D.roles.forEach(function(r){ c += (D.units[u][r]||[]).length; });
  return c;
}
function byStaffCountDesc(a,b){ return unitStaffCount(b) - unitStaffCount(a); }
function segregatedUnitsSorted(keys){ return segregatedUnits(keys, byStaffCountDesc); }
function computeStats(){
  var roles = D.roles, units = D.units;
  var unitKeys = Object.keys(units);
  var totalTagged = 0, activeUnits = 0, vacantCount = 0;
  var perUnitCounts = {};
  unitKeys.forEach(function(u){
    var c = 0;
    roles.forEach(function(r){
      var n = (units[u][r]||[]).length;
      c += n;
      if(n===0 && !isClinicUnit(u)) vacantCount++;
    });
    perUnitCounts[u] = c;
    totalTagged += c;
    if(c>0) activeUnits++;
  });
  var totalMulti = 0;
  unitKeys.forEach(function(u){ totalMulti += (D.multiRole[u]||[]).length; });
  var seg = segregatedUnits(unitKeys);
  return {unitKeys:unitKeys, totalTagged:totalTagged, activeUnits:activeUnits, vacantCount:vacantCount,
    perUnitCounts:perUnitCounts, totalMulti:totalMulti, hospitalKeys:seg.hospitals, clinicKeys:seg.clinics};
}

  var warnBadge = overfilled ? '<span class="onlyone-badge" title="This role should have only one person">&#9888; '+list.length+' assigned, expected 1</span>' : '';
  return '<table class="orgtable '+tierClass+(overfilled?' overfilled':'')+'">'+
    '<tr><th colspan="2" class="rolehead">'+esc(role)+warnBadge+'</th></tr>'+
    '<tr><th class="colhead">ID</th><th class="colhead">NAME</th></tr>'+
    rows+
  '</table>';
}
function trimBranchLine(row){
  if(!row) return;
  var items = row.querySelectorAll(':scope > .orgbranchitem');
  if(!items.length){ row.style.removeProperty('--line-left'); row.style.removeProperty('--line-right'); return; }
  var rowRect = row.getBoundingClientRect();
  var first = items[0].getBoundingClientRect();
  var last = items[items.length-1].getBoundingClientRect();
  row.style.setProperty('--line-left', Math.max(0, first.left - rowRect.left) + 'px');
  row.style.setProperty('--line-right', Math.max(0, rowRect.right - last.right) + 'px');
}
window.addEventListener('resize', function(){
  trimBranchLine(document.querySelector('#orgChartHolder .orgbranchrow'));
});
function renderOrgChart(){
  var holder = document.getElementById('orgChartHolder');
  var group = ORG_TREE[selectedOrgGroup];

  var html = '<div class="orgwrap"><div class="orgchain">';
  html += orgTableHtml(group.head, 'tier-head', true);

  if(group.children.length){
    html += '<div class="orgconn"></div><div class="orgtierlabel">In charge &amp; team</div>';
    html += '<div class="orgscroll"><div class="orgbranchrow">';
    group.children.forEach(function(ch){
      html += '<div class="orgbranchitem">';
      html += orgTableHtml(ch.role, 'tier-mid', true);
      if(ch.pharm){
        html += '<div class="orgconn orgconn-sm"></div>';
        html += orgTableHtml(ch.pharm, 'tier-low', false);
      }
      html += '</div>';
    });
    html += '</div></div>';
  }

  html += '</div></div>';
  holder.innerHTML = html;
  trimBranchLine(holder.querySelector('.orgbranchrow'));
  staggerIn(holder, '.orgchain > .orgtable, .orgbranchitem', 60);
  wireTilt(holder, '.orgtable');
}

// ---------------- MULTI-ROLE STAFF (unit-wise, connection style) ----------------
function roleTier(role){
  for(var g=0; g<ORG_TREE.length; g++){
    var grp = ORG_TREE[g];
    if(grp.head===role) return 3;
    for(var c=0;c<grp.children.length;c++){
      if(grp.children[c].role===role) return 2;
      if(grp.children[c].pharm===role) return 1;
    }
  }
  return 0;
}
function renderMulti(){
  var units = D.units, unitNames = D.unitNames;
  var mp = document.getElementById('panel-multi');
  var blocks = '';
  var any = false;
  segregatedUnitsSorted(Object.keys(units)).all.forEach(function(u){
    var list = (D.multiRole[u]||[]).slice();
    if(!list.length) return;
    any = true;
    list.sort(function(a,b){
      var ta = Math.max.apply(null, a.roles.map(roleTier));
      var tb = Math.max.apply(null, b.roles.map(roleTier));
      return tb - ta;
    });
    var empHtml = list.map(function(e){
      var sortedRoles = e.roles.slice().sort(function(a,b){return roleTier(b)-roleTier(a);});
      return '<div class="connectcard" style="margin-bottom:10px;"><div class="emphead"><div class="empdot">'+esc(initials(e.name))+'</div>'+
        '<div><strong>'+esc(e.name||'\u2014')+'</strong><div style="font-size:11.5px;color:var(--text-muted);">'+esc(e.id||'\u2014')+'</div></div></div>'+
        '<div class="rolelist">'+
        sortedRoles.map(function(r,i){
          return '<div class="rolelistitem"><span class="num">'+(i+1)+'-</span>'+esc(r)+'</div>';
        }).join('') +
        '</div></div>';
    }).join('');
    var icon = isClinicUnit(u) ? '&#127974;' : '&#127973;';
    blocks += '<div class="card" style="margin-bottom:0;"><p class="metric-label" style="margin-bottom:10px;">'+icon+' '+esc(unitNames[u]||u)+' &middot; '+list.length+' employee(s) with multiple roles</p>'+
      '<div>'+empHtml+'</div></div>';
  });
  if(!any){
    mp.innerHTML = '<div class="card"><p class="note" style="margin:0;">No employees currently hold more than one role in any unit.</p></div>';
    return;
  }
  mp.innerHTML = '<div class="vacantunits">'+blocks+'</div>';
  staggerIn(mp, '.vacantunits > .card', 45);
  staggerIn(mp, '.connectcard', 20);
  wireTilt(mp);
}

// ---------------- UNASSIGNED / VACANT ROLES ----------------
function renderVacant(){
  var units = D.units, unitNames = D.unitNames, roles = D.roles;
  var vp = document.getElementById('panel-vacant');
  var html = '';
  var totalVacant = 0;

      '<div class="vacantgrid">'+

// ---------------- BED CAPACITY ----------------
var BED_COUNTS = {
  ggn:300, gurugram:300,
  patna:392, pat:392,
  pkl:284, panchkula:284,
  dar:100, darbhanga:100,
  ran:300, ranchi:300,
  udp:200, udaipur:200,
  srn:200, srinagar:200,
  knp:435, kanpur:435
};
function getBedCount(u){
  var key = String(u).toLowerCase();
  if(BED_COUNTS[key] != null) return BED_COUNTS[key];
  var nm = String(D.unitNames[u]||'').toLowerCase().replace(/\s+/g,'');
  if(BED_COUNTS[nm] != null) return BED_COUNTS[nm];
  return null;
}
function renderCapacity(){
  var units = D.units, unitNames = D.unitNames, roles = D.roles;
  var cp = document.getElementById('panel-capacity');
  var opRoles = ['OP Pharmacy In Charge','OP Pharmacy pharmacist'].filter(function(r){return roles.indexOf(r)>-1;});
  var ipRoles = ['IP Pharmacy In Charge','IP Pharmacy Pharmacist'].filter(function(r){return roles.indexOf(r)>-1;});
  var otRoles = ['OT/Cath Pharmacy In Charge','OT/Cath Pharmacy Pharmacist'].filter(function(r){return roles.indexOf(r)>-1;});
  var purchRoles = roleGroupList(1).filter(function(r){return roles.indexOf(r)>-1;});

  function countOf(u, list){
    var c=0; list.forEach(function(r){c+=(units[u][r]||[]).length;}); return c;
  }
  function per100(count, beds){
    return (beds && beds>0) ? (count/beds*100).toFixed(1) : null;
  }

  function rowsFor(unitList){
    var rows = unitList.map(function(u){
      var beds = getBedCount(u);
      var total = unitStaffCount(u);
      var opC = countOf(u, opRoles), ipC = countOf(u, ipRoles), otC = countOf(u, otRoles), purchC = countOf(u, purchRoles);
      return {u:u, beds:beds, total:total, opC:opC, ipC:ipC, otC:otC, purchC:purchC};
    });
    rows.sort(function(a,b){
      if(a.beds==null && b.beds==null) return b.total-a.total;
      if(a.beds==null) return 1;
      if(b.beds==null) return -1;
      return b.beds - a.beds;
    });
    return rows;
  }

  function cellHtml(count, beds){
    var ratio = per100(count, beds);
    if(ratio==null){
      return '<td class="countcell">'+count+'<div class="rutable-sub">total</div></td>';
    }
    return '<td class="countcell">'+ratio+'<div class="rutable-sub">total: '+count+'</div></td>';
  }

  function tableHtml(title, icon, rows){
    if(!rows.length) return '';
    var body = rows.map(function(r){
      return '<tr><td class="rolecell">'+esc(unitNames[r.u]||r.u)+'</td>'+
        '<td class="countcell">'+(r.beds!=null?r.beds:'&mdash;')+'</td>'+
        cellHtml(r.total, r.beds)+
        cellHtml(r.opC, r.beds)+
        cellHtml(r.ipC, r.beds)+
        cellHtml(r.otC, r.beds)+
        cellHtml(r.purchC, r.beds)+
      '</tr>';
    }).join('');
    return '<div class="card" style="margin-bottom:1rem;"><p class="metric-label" style="margin-bottom:10px;">'+icon+' '+title+'</p>'+
      '<div style="overflow-x:auto;"><table class="rutable">'+
      '<tr><th class="rutable-corner">Unit</th><th>Beds</th><th>Total staff /100 beds</th><th>OP Pharmacy /100 beds</th><th>IP Pharmacy /100 beds</th><th>OT/Cath Pharmacy /100 beds</th><th>Purchase /100 beds</th></tr>'+
      body+
      '</table></div></div>';
  }

  var hospRows = rowsFor(Object.keys(units).filter(function(u){return !isClinicUnit(u);}));
  var clinicRows = rowsFor(Object.keys(units).filter(isClinicUnit));

  var html = '<p class="note">Beds sourced from hospital records; staff counts reflect currently tagged employees. Each figure shows staff per 100 beds, with the raw total below. Sorted by bed count, highest to lowest.</p>'+
    tableHtml('Hospitals &middot; bed capacity', '&#127973;', hospRows)+
    tableHtml('Mediclinics &middot; bed capacity', '&#127974;', clinicRows);
  cp.innerHTML = html || '<div class="card"><p class="note" style="margin:0;">No unit data available.</p></div>';
  staggerIn(cp, '.rutable tr', 18);
  wireTilt(cp);
}


var tabs = document.querySelectorAll('.tabbtn');
var panels = ['overview','rights','tagged','multi','vacant','capacity'];
function activateTab(tab){
  tabs.forEach(function(b){b.classList.toggle('active', b.dataset.tab===tab);});
  panels.forEach(function(p){document.getElementById('panel-'+p).classList.toggle('show', p===tab);});
}
tabs.forEach(function(btn){ btn.addEventListener('click', function(){ activateTab(btn.dataset.tab); }); });

// ---------------- FILE UPLOAD ----------------
var dropzone = document.getElementById('dropzone');
var fileInput = document.getElementById('fileInput');
var fileStatus = document.getElementById('fileStatus');
['dragenter','dragover'].forEach(function(evt){
  dropzone.addEventListener(evt, function(e){ e.preventDefault(); dropzone.classList.add('drag'); });
});
['dragleave','drop'].forEach(function(evt){
  dropzone.addEventListener(evt, function(e){ e.preventDefault(); dropzone.classList.remove('drag'); });
});
dropzone.addEventListener('drop', function(e){
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e){
  if(e.target.files.length) handleFile(e.target.files[0]);
});
fileInput.addEventListener('cancel', function(){
  try{
    var hasSaved = !!localStorage.getItem('scm_dash_data');
    if(hasSaved && D.roles && D.roles.length){
      fileStatus.className = 'ok';
      fileStatus.textContent = '\u2713 Still showing the previously loaded data. Click "Refresh data" when you have an updated file.';
    }
  }catch(err){}
});
function handleFile(file){
  fileStatus.className = '';
  fileStatus.textContent = 'Reading ' + file.name + '\u2026';
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var parsed = parseWorkbook(wb);
      D = parsed;
      selectedRole = null; selectedUnit = null;
      renderAll();
      fileStatus.className = 'ok';
      fileStatus.textContent = '\u2713 Loaded ' + file.name + ' \u2014 ' + wb.SheetNames.length + ' sheets read successfully.';
      try{
        localStorage.setItem('scm_dash_data', JSON.stringify(parsed));
        localStorage.setItem('scm_dash_meta', JSON.stringify({name:file.name, sheets:wb.SheetNames.length, savedAt:Date.now()}));
      }catch(storageErr){ /* storage full or unavailable - silently skip, upload still works */ }
    }catch(err){
      fileStatus.className = 'err';
      fileStatus.textContent = '\u2717 Could not read this file: ' + err.message;
    }
  };
  reader.onerror = function(){
    fileStatus.className = 'err';
    fileStatus.textContent = '\u2717 Failed to read the file.';
  };
  reader.readAsArrayBuffer(file);
}

function tryLoadSavedData(){
  try{
    var raw = localStorage.getItem('scm_dash_data');
    var metaRaw = localStorage.getItem('scm_dash_meta');
    if(!raw) return false;
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.roles || !parsed.roles.length) return false;
    D = parsed;
    var meta = metaRaw ? JSON.parse(metaRaw) : null;
    var when = meta && meta.savedAt ? new Date(meta.savedAt).toLocaleString() : '';
    fileStatus.className = 'ok';
    fileStatus.textContent = '\u2713 Restored ' + (meta?meta.name:'last file') + (when?(' \u2014 saved '+when):'') + '. Upload a new file to refresh.';
    document.getElementById('clearBtn').style.display = 'inline-block';
    return true;
  }catch(e){ return false; }
}
document.getElementById('clearBtn').addEventListener('click', function(){
  fileStatus.className = '';
  fileStatus.textContent = 'Please choose the updated file to refresh the data\u2026';
  document.getElementById('fileInput').click();
});

function syncStickyOffset(){
  var topbar = document.querySelector('.topbar');
  var tabs = document.getElementById('tabs');
  if(topbar && tabs){ tabs.style.top = topbar.offsetHeight + 'px'; }
}
syncStickyOffset();
window.addEventListener('resize', syncStickyOffset);

tryLoadSavedData();
activateTab('overview');
renderAll();
</script>
<!-- paras-command-centre-bridge -->
<script>
/* Paras Command Centre — dashboard bridge.
 *
 * Injected into each dashboard by sync.py. It adds nothing you can see and
 * changes nothing the dashboard does in ordinary use: it only listens for the
 * Command Centre handing over a file, and puts it in the dashboard's own
 * upload box exactly as if you had picked it yourself.
 *
 * This exists because a page opened straight from disk (file://) is sealed off
 * from every other page, so the Command Centre cannot reach in — but the two
 * can still exchange messages. Remove the injected block and the dashboard
 * carries on working; only the one-click fill stops.
 *
 * It also stops one specific bad outcome: picking an oversized file straight
 * into this dashboard's own upload box, past what its own parser can hold in
 * memory, crashes the browser tab. That is refused here, before the file ever
 * reaches the dashboard's own code, in favour of the Command Centre's Data
 * Library — which streams a file this size instead of loading it whole.
 *
 * It also relays the shell's dark/light theme toggle: whenever the Command
 * Centre's own theme changes (and once immediately when this dashboard first
 * loads), it stamps data-theme="dark"|"light" on this document's <html> and
 * fires a "parasthemechange" event, so any dashboard that defines its own
 * :root[data-theme="light"] palette follows the shell's toggle instead of
 * carrying a separate one of its own. A dashboard with no light palette yet
 * simply ignores the attribute -- this is a no-op until one is added.
 *
 * It also reports which way this dashboard's own page is being scrolled, so
 * the Command Centre can tuck its "Back to Command Centre" bar away while
 * reading and bring it back the moment the scroll direction reverses. This
 * dashboard's markup and behaviour are otherwise untouched by it.
 */
(function (w, d) {
  'use strict';
  if (w.__parasBridge) return;
  w.__parasBridge = 1;

  // Mirrors assets/js/library.js's BIG_FILE. Duplicated because this file is
  // injected standalone into a different page and has no import of its own.
  var TOO_BIG = 40 * 1024 * 1024;

  function warnTooBig(file) {
    var mb = Math.round(file.size / 1048576);
    try {
      w.alert(
        '"' + file.name + '" is ' + mb + ' MB.\n\n' +
        'That is too large for this page to open directly \u2014 a file this size ' +
        'can crash the browser tab partway through.\n\n' +
        'Use the Data Library in the Paras Command Centre instead: add the file ' +
        'there, press Condense, then Fill upload boxes. The condensed file keeps ' +
        'every total exactly the same, just as far fewer rows, and opens here safely.'
      );
    } catch (e) {}
  }

  /* Runs before the dashboard's own listeners: capture-phase, on the
     document, is reached on the way down the tree before the target (and its
     bubble-phase handlers) sees the event at all. stopImmediatePropagation
     here means the dashboard's own upload code never runs for this file. A
     file the Command Centre hands over through postMessage (always well
     under the limit, since it comes from the Data Library already condensed
     if it needed to be) is untouched. */
  d.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t || t.tagName !== 'INPUT' || t.type !== 'file' || !t.files || !t.files.length) return;
    var f = t.files[0];
    if (f.size <= TOO_BIG) return;
    ev.stopImmediatePropagation();
    ev.preventDefault();
    try { t.value = ''; } catch (e2) {}
    warnTooBig(f);
  }, true);

  d.addEventListener('drop', function (ev) {
    var dt = ev.dataTransfer;
    if (!dt || !dt.files || !dt.files.length) return;
    var f = dt.files[0];
    if (f.size <= TOO_BIG) return;
    ev.stopImmediatePropagation();
    ev.preventDefault();
    warnTooBig(f);
  }, true);

  function label(inp, i) {
    var t = '';
    try {
      if (inp.labels && inp.labels.length) t = inp.labels[0].textContent;
      if (!t && inp.closest) { var l = inp.closest('label'); if (l) t = l.textContent; }
      var box = inp.parentElement;
      for (var k = 0; k < 3 && box && !t; k++) {
        var q = box.querySelector('label, h3, h4, b, strong, .label');
        if (q && q.textContent.trim()) t = q.textContent;
        box = box.parentElement;
      }
      if (!t) t = inp.getAttribute('aria-label') || inp.getAttribute('title') || inp.name || inp.id || '';
    } catch (e) {}
    return String(t).replace(/\s+/g, ' ').trim().slice(0, 80);
  }

  function inputs() {
    return Array.prototype.slice.call(d.querySelectorAll('input[type=file]'));
  }

  function reply(src, id, body) {
    try { src.postMessage(Object.assign({ __paras: 1, id: id }, body), '*'); } catch (e) {}
  }

  w.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.__paras !== 1 || !m.action) return;
    // Only the page that embedded this one may drive it.
    if (w.parent === w || ev.source !== w.parent) return;

    if (m.action === 'theme') {
      try {
        var theme = m.theme === 'light' ? 'light' : 'dark';
        d.documentElement.setAttribute('data-theme', theme);
        d.dispatchEvent(new CustomEvent('parasthemechange', { detail: { theme: theme } }));
      } catch (e) {}
      return;
    }

    if (m.action === 'probe') {
      reply(ev.source, m.id, {
        ok: true,
        inputs: inputs().map(function (inp, i) {
          return { index: i, label: label(inp, i), accept: inp.getAttribute('accept') || '' };
        })
      });
      return;
    }

    if (m.action === 'fill') {
      var list = inputs(), inp = list[m.index];
      if (!inp) return reply(ev.source, m.id, { ok: false, error: 'no such upload box' });
      try {
        var file = (m.blob instanceof File) ? m.blob
          : new File([m.blob], m.name || 'file', { type: m.type || (m.blob && m.blob.type) || '' });
        var dt = new DataTransfer();
        dt.items.add(file);
        inp.files = dt.files;
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        inp.dispatchEvent(new Event('change', { bubbles: true }));
        reply(ev.source, m.id, { ok: true });
      } catch (e) {
        reply(ev.source, m.id, { ok: false, error: String(e && e.message || e) });
      }
    }
  }, false);

  // Scroll-direction relay -- see header comment. Skipped entirely when this
  // page is not embedded (opened on its own), since there is no parent to
  // tell and nothing here changes how the page behaves either way.
  if (w.parent !== w) {
    // A wide dead zone -- small back-and-forth wobble (trackpads and touch
    // scrolling rarely move in one perfectly monotonic direction) used to
    // flip `dir` on almost every frame, which made the parent's toolbar
    // toggle its collapse animation dozens of times a second during a single
    // scroll gesture. Only sending on an actual change (not every frame)
    // cuts that further, since the parent only re-renders on a real flip.
    // Also debounced in time, not just in distance: a real scroll gesture
    // (trackpad inertia especially) can cross the 24px dead zone several
    // times in quick succession even while "generally" going one way, and
    // each crossing used to restart the parent's collapse/expand animation
    // from scratch -- which is what made the bar look like it was stuck
    // fading in and out instead of settling. Capping actual sends to once
    // per MIN_INTERVAL bounds how often that animation can restart, no
    // matter how choppy the underlying scroll events are.
    var lastY = 0, dir = 'up', sentDir = null, ticking = false, lastSentAt = 0;
    var MIN_INTERVAL = 220;
    function sendScroll() {
      var y = w.pageYOffset || (d.documentElement && d.documentElement.scrollTop) || 0;
      if (y <= 0) dir = 'up';
      else if (y > lastY + 24) dir = 'down';
      else if (y < lastY - 24) dir = 'up';
      lastY = y;
      var now = w.performance && w.performance.now ? w.performance.now() : Date.now();
      if (dir !== sentDir && (now - lastSentAt) >= MIN_INTERVAL) {
        sentDir = dir;
        lastSentAt = now;
        try { w.parent.postMessage({ __paras: 1, action: 'scroll', dir: dir }, '*'); } catch (e) {}
      }
      ticking = false;
    }
    w.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      (w.requestAnimationFrame || w.setTimeout)(sendScroll);
    }, { passive: true });
  }
})(window, document);
</script>
<!-- /paras-command-centre-bridge -->
</body>
